calyx_lib:
  general:
    format:
      datetime: "%Y:%m:%d %H:%M:%S"
  # calyx_lib.config
  config:
    saving:
      config_saved: 配置文件已保存至 '{file}'
      comments:
        saving_at: "配置文件上次保存时间: {}"
        fixed_type_error: |
          <错误报告>
          由于内容校验失败，配置项 "{key}" 改用了默认值
          校验错误信息:
          {errors}
          原先的值: {value}
        fixed_missing: |
          已补齐缺失的配置项 "{key}" 的默认值

    loading:
      # Warnings
      file_not_found: 配置文件 '{file}' 未找到, 已重新生成
      yaml_syntax_error: 损坏的 YAML 文件, 已重新生成
      type_fixed: 配置项 '{key}' 类型验证失败, 已使用默认值覆盖
      item_lost: 配置项 '{key}' 未找到，已使用默认值补全
      # Info
      config_loaded: 配置文件已加载
    in_game:
      # Info
      default_value_hint: "(默认值)"
      modified_value_hint: "(非默认)"
      value_set: 已将配置键 §e{key}§r 的值设置为 §b{value}§r
      config_saved: 配置文件§a已保存§r
      config_not_saved: 配置文件§e未保存§r
      undo_modify: "[§7撤销§r]"
      # Error
      invalid_key: 并未找到名为 "{}" 的键
      conflict_args: 输入了冲突的参数
      illegal_value: 不合法的值或键名输入错误
      set_failed: 未知原因配置设置失败
      # Warning:
      duplicated_args: 已忽略重复输入的参数

      # Hover
      suggested_value_hover: 点此将配置项 §e{key}§r 设为 §b{value}§r
      default_desc: 暂未提供简介
      undo_hover: 点此将配置项 §e{key}§r 改回 §b{value}§r
  help_message:
    suggest: 点击以填入指令 §7{}§r
  list_widget:
    prev_button:
      hover: 点击浏览上一页
    next_button:
      hover: 点击浏览下一页
